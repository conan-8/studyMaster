services:
  postgres:
    image: postgres:16-alpine
    container_name: studymaste-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: studymaste
      POSTGRES_PASSWORD: studymaste
      POSTGRES_DB: studymaste
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymaste -d studymaste"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
